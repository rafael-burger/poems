[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poem-tool"
version = "0.1.0"
description = "CLI for managing the poems static site"
requires-python = ">=3.9"

[project.scripts]
poem = "poem_tool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poem_tool*"]
